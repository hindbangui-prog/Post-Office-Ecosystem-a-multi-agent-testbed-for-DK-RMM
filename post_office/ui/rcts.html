<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCT log</title>
<!--
  The RCT log. Every RCT DK-RMM detected in this app's runs, this one and the
  earlier ones, read from the files saved at detection (results/rct/<run>/).
  Each RCT carries the scenario it was detected in, and the log is read one
  scenario at a time (the current run's by default), so Normal's RCTs and each
  stressed scenario's are never mixed in one count.
  Selecting one shows its cause as it was saved then: the events of its window,
  the expert discussions near it and the baseline it was compared with. The
  page only reads; DK-RMM is neither consulted nor changed.
-->
<style>
  :root {
    --bg: #f7f8fa; --panel: #fff; --ink: #171a1f; --dim: #4a5261;
    --faint: #8b93a1; --line: #e3e6ea; --accent: #1f6feb;
    --rct: #8c1d3f; --rctbg: #fdeaf0; --rctline: #efb6c8;
    --ok: #1d6b34; --okbg: #e9f6ec; --no: #6b7280; --nobg: #eef0f3;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121519; --panel: #171b21; --ink: #e9ecf1; --dim: #b3bac6;
      --faint: #7f8896; --line: #262c35; --accent: #5b9dff;
      --rct: #f08fae; --rctbg: #2d1420; --rctline: #572338;
      --ok: #7fd69a; --okbg: #16281c; --no: #a3abb8; --nobg: #20252d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { padding: 14px 16px; display: grid; gap: 12px; height: 100%;
          grid-template-rows: auto 1fr; }
  header { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  .muted { color: var(--faint); font-size: 12.5px; }
  .filter { display: inline-flex; border: 1px solid var(--line); border-radius: 7px;
            overflow: hidden; }
  .filter button { background: var(--panel); color: var(--dim); border: 0;
                   padding: 4px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .filter button + button { border-left: 1px solid var(--line); }
  select { font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 7px;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .scen-name { color: var(--rct); }
  .filter button[aria-pressed="true"] { background: var(--rctbg); color: var(--rct);
                                        font-weight: 600; }

  .cols { display: grid; gap: 12px; grid-template-columns: minmax(420px, 1fr) 1.25fr;
          min-height: 0; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           min-height: 0; overflow: auto; }
  .panel.detail { padding: 14px 16px; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left;
       font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
       color: var(--faint); font-weight: 600; padding: 8px 10px;
       border-bottom: 1px solid var(--line); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px;
       vertical-align: top; }
  .num { text-align: right; }
  td.nw { white-space: nowrap; }
  tr.rct { cursor: pointer; }
  tr.rct:hover td { background: var(--bg); }
  tr.rct.sel td { background: var(--rctbg); }
  tr.rct.sel td:first-child { box-shadow: inset 3px 0 0 var(--rct); }
  .tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 9px;
         background: var(--rctbg); color: var(--rct); font-weight: 600; margin-left: 4px; }
  .gate { font-size: 11px; font-weight: 600; }
  .gate.VALIDATED, .gate.ACTIVE { color: var(--ok); }
  .gate.DISMISSED { color: var(--no); }
  .empty { padding: 28px 16px; color: var(--faint); }

  .d-title { font-size: 15px; margin: 0 0 2px; }
  .d-sub { color: var(--faint); font-size: 12px; margin: 0 0 12px; }
  .ex-sum { font-size: 13.5px; margin: 0 0 10px; }
  .ex-h { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
          color: var(--faint); font-weight: 600; margin: 16px 0 6px; }
  .ex-kinds { display: grid; gap: 8px 18px;
              grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .ex-kind b { font-size: 12.5px; }
  .ex-kind span { color: var(--faint); font-size: 11.5px; }
  .ex-kind ul, .ev { margin: 3px 0 0; padding-left: 16px; font-size: 12px; color: var(--dim); }
  .ex-note { font-size: 11.5px; color: var(--faint); margin: 8px 0 0; }
  .ex-disc td, .ex-disc th { font-size: 12px; padding: 4px 6px; position: static; }
  .strong { color: var(--rct); font-weight: 650; }
  .scroll-x { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RCT log · <span class="scen-name" id="scen-name">…</span></h1>
    <label class="muted">scenario
      <select id="scenario" aria-label="Which scenario's RCTs"></select>
    </label>
    <span class="filter" role="group" aria-label="Which runs">
      <button type="button" id="f-all" aria-pressed="true">All runs</button>
      <button type="button" id="f-this" aria-pressed="false">This run</button>
    </span>
    <span class="muted" id="note">reading the log…</span>
  </header>
  <div class="cols">
    <div class="panel" id="list"></div>
    <div class="panel detail" id="detail">
      <p class="empty">Select an RCT to see what drove it.</p>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(value) { const n = Number(value); return isFinite(n) ? n.toFixed(2) : "-"; }
function short(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit",
                                minute: "2-digit", second: "2-digit" });
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString([], { day: "2-digit", month: "short", year: "numeric",
                                hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
const key = (r) => r.run + "@" + r.tick;

let LOG = { rcts: [], current_run: "", recording: true };
let onlyThis = false;
let scenario = null;          // the scenario shown; null = the current run's
const ALL = "*";
let selected = null;          // key of the selected RCT
const CAUSE = {};             // key -> saved file, fetched once
const INFLIGHT = new Set();

function labelOf(key) {
  if (key === ALL) return "all scenarios";
  const s = (LOG.scenarios || []).find((x) => x.scenario === key);
  return s ? s.scenario_label : (key || "unknown");
}

function rows() {
  return LOG.rcts.filter((r) => (scenario === ALL || r.scenario === scenario)
                                && (!onlyThis || r.current));
}

function drawScenarios() {
  const box = $("scenario");
  const list = LOG.scenarios || [];
  const want = [[ALL, "All scenarios (" + LOG.rcts.length + ")"]].concat(
    list.map((s) => [s.scenario, s.scenario_label + " (" + s.count + ")"
                     + (s.scenario === LOG.current_scenario ? " - this run" : "")]));
  const html = want.map(([k, t]) => '<option value="' + esc(k) + '">' + esc(t) + "</option>").join("");
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }
  box.value = scenario;
  $("scen-name").textContent = labelOf(scenario);
}

function drawList() {
  drawScenarios();
  const list = rows();
  const where = labelOf(scenario);
  const note = !LOG.recording ? "This app is not saving RCTs, so there is nothing to list."
    : list.length + " RCT" + (list.length === 1 ? "" : "s") + " in " + where
      + (onlyThis ? " (this run)" : "")
      + (LOG.current_run ? " · this run: " + LOG.current_run + ", "
         + (LOG.current_scenario_label || "") : "")
      + " · each with its cause as it stood when it was detected";
  $("note").textContent = note;
  if (!list.length) {
    $("list").innerHTML = '<p class="empty">No RCT detected in ' + esc(where)
      + (onlyThis ? " in this run" : "") + " so far.</p>";
    return;
  }
  // The scenario column only when more than one scenario is on show.
  const many = scenario === ALL;
  $("list").innerHTML = '<table><thead><tr><th>Detected</th>'
    + (many ? "<th>Scenario</th>" : "") + "<th>Run</th>"
    + '<th class="num">Tick</th><th>Kinds</th><th class="num">Severity</th><th>Gate</th>'
    + "</tr></thead><tbody>" + list.map((r) =>
      '<tr class="rct' + (selected === key(r) ? " sel" : "") + '" data-key="' + esc(key(r))
      + '" title="' + esc(when(r.detected_at)) + '"><td class="nw">'
      + esc(short(r.detected_at) || "-") + "</td>"
      + (many ? '<td class="nw">' + esc(r.scenario_label || "unknown") + "</td>" : "")
      + '<td class="nw">' + esc(r.run) + (r.current ? '<span class="tag">this run</span>' : "") + "</td>"
      + '<td class="num">' + r.tick + '</td><td class="nw">' + esc((r.kinds || []).join(", ")) + "</td>"
      + '<td class="num">' + fmt(r.severity) + "</td>"
      + '<td><span class="gate ' + esc(r.status) + '">'
      + (r.status === "DISCOVERED" ? "" : esc(r.status || "")) + "</span></td></tr>").join("")
    + "</tbody></table>";
}

function causeHtml(x) {
  const kinds = (x.kinds || []).map((k) =>
    '<div class="ex-kind"><b>' + esc(k.kind) + " · " + k.count + "</b> <span>"
    + esc(k.about) + "</span><ul>" + k.topics.map((t) =>
      "<li>" + esc(t.topic.replace(/_/g, " ")) + " " + t.count + " - "
      + t.agents.map((a) => esc(a[0]) + " " + a[1]).join(", ") + "</li>").join("")
    + "</ul></div>").join("") || '<p class="ex-note">No trouble events in this window.</p>';
  const disc = x.discussions || [];
  const discHtml = disc.length
    ? '<div class="scroll-x"><table class="ex-disc"><thead><tr><th>Consultation</th><th>Decision</th>'
      + '<th>Outcome</th><th class="num">Ticks</th><th class="num">Strong links</th>'
      + '<th class="num">Weak links</th></tr></thead><tbody>' + disc.map((d) =>
        "<tr><td><b>" + esc(d.id) + "</b> " + esc(d.owner) + " ↔ " + esc(d.peer) + "</td>"
        + "<td>" + esc(d.decision) + (d.choice ? " → " + esc(d.choice) : "") + "</td>"
        + "<td>" + esc(String(d.outcome || "open").replace(/_/g, " ")) + "</td>"
        + '<td class="num">' + d.opened + "–" + (d.closed == null ? "" : d.closed) + "</td>"
        + '<td class="num' + (d.strong ? " strong" : "") + '">' + d.strong + "</td>"
        + '<td class="num">' + d.weak + "</td></tr>").join("") + "</tbody></table></div>"
    : '<p class="ex-note">No expert consultation was open in this window or just before it.</p>';
  const b = x.baseline || {};
  const base = b.windows
    ? "This window: <b>" + b.this + "</b> trouble events. The " + b.windows
      + " windows it was compared with: mean " + b.mean + ", range " + b.min + "–" + b.max + "."
    : "No earlier windows to compare with.";
  const l = x.linked || {};
  const w = x.window || ["?", "?"];
  return '<p class="ex-sum"><b>' + esc(x.summary) + "</b></p>"
    + '<div class="ex-h">What the window held (ticks ' + w[0] + "–" + w[1] + ", "
    + x.events + " events, " + x.trouble + " of them trouble)</div>"
    + '<div class="ex-kinds">' + kinds + "</div>"
    + '<p class="ex-note">' + x.messages + " messages in the window, " + x.discussion_messages
    + " of them between experts consulting.</p>"
    + '<div class="ex-h">Expert consultations near this RCT</div>' + discHtml
    + '<p class="ex-note">Trouble events linked: ' + (l.strong || 0) + " strongly (same task or parcel), "
    + (l.weak || 0) + " only through a shared robot, " + (l.none || 0) + " to no consultation. "
    + "A link is evidence, not proof of cause: compare with the same run with consultations off.</p>"
    + '<div class="ex-h">Against its baseline</div><p class="ex-note">' + base + "</p>";
}

function drawDetail() {
  const box = $("detail");
  const row = LOG.rcts.find((r) => key(r) === selected);
  if (!row) { box.innerHTML = '<p class="empty">Select an RCT to see what drove it.</p>'; return; }
  const saved = CAUSE[selected];
  const head = '<h2 class="d-title">RCT at tick ' + row.tick + "</h2>"
    + '<p class="d-sub">' + esc(row.scenario_label || "unknown scenario")
    + " · run " + esc(row.run) + (row.current ? " (this run)" : "")
    + " · detected " + esc(when(row.detected_at) || "-")
    + " · severity " + fmt(row.severity) + "</p>";
  if (!saved) { box.innerHTML = head + '<p class="ex-note">reading the saved cause…</p>'; return; }
  if (saved.error) { box.innerHTML = head + '<p class="ex-note">' + esc(saved.error) + "</p>"; return; }
  const r = saved.reading || {};
  const gate = r.status && r.status !== "DISCOVERED"
    ? '<p class="ex-note">Gate: <span class="gate ' + esc(r.status) + '">' + esc(r.status)
      + "</span>" + (r.decided_by ? " by " + esc(r.decided_by) : "")
      + (r.decided_at ? ", " + esc(when(r.decided_at)) : "")
      + (r.note ? " - “" + esc(r.note) + "”" : "") + "</p>"
    : '<p class="ex-note">Gate: not yet validated or dismissed.</p>';
  const evidence = (r.evidence || []).length
    ? '<ul class="ev">' + r.evidence.map((e) => "<li>" + esc(e) + "</li>").join("") + "</ul>"
    : '<p class="ex-note">No evidence lines saved.</p>';
  box.innerHTML = head
    + '<div class="ex-h">What DK-RMM saw</div>' + evidence + gate
    + '<div class="ex-h">Cause, as saved at detection</div>'
    + (saved.explanation ? causeHtml(saved.explanation)
                         : '<p class="ex-note">No explanation was saved with this RCT.</p>');
}

async function select(k) {
  selected = k;
  drawList(); drawDetail();
  if (CAUSE[k] || INFLIGHT.has(k)) return;
  const row = LOG.rcts.find((r) => key(r) === k);
  if (!row) return;
  INFLIGHT.add(k);
  try {
    const response = await fetch("/dkrmm/rct-log/item?run=" + encodeURIComponent(row.run)
                                 + "&tick=" + row.tick, { headers: { Accept: "application/json" } });
    const body = await response.json().catch(() => ({}));
    CAUSE[k] = response.ok ? body : { error: body.detail || response.status + " " + response.statusText };
  } catch (_) {
    CAUSE[k] = { error: "The saved cause needs the running app: nothing answered at /dkrmm/rct-log/item." };
  }
  INFLIGHT.delete(k);
  if (selected === k) drawDetail();
}

$("scenario").addEventListener("change", (e) => {
  scenario = e.target.value;
  if (!rows().some((r) => key(r) === selected)) {
    const first = rows()[0];
    if (first) { select(key(first)); return; }
    selected = null; drawDetail();
  }
  drawList();
});
$("list").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.rct");
  if (tr) select(tr.dataset.key);
});
for (const [id, value] of [["f-all", false], ["f-this", true]]) {
  $(id).addEventListener("click", () => {
    onlyThis = value;
    $("f-all").setAttribute("aria-pressed", String(!value));
    $("f-this").setAttribute("aria-pressed", String(value));
    drawList();
  });
}

let statusSeen = {};
async function poll() {
  try {
    const response = await fetch("/dkrmm/rct-log", { headers: { Accept: "application/json" } });
    if (response.ok) {
      LOG = await response.json();
      // Opens on the scenario the app is running now; a choice made here stays.
      if (scenario == null) scenario = LOG.current_scenario || ALL;
      // A gate decision made after the cause was fetched: fetch it again.
      for (const r of LOG.rcts) {
        const k = key(r);
        if (statusSeen[k] !== undefined && statusSeen[k] !== r.status) delete CAUSE[k];
        statusSeen[k] = r.status;
      }
      drawList();
      if (selected == null && rows().length) select(key(rows()[0]));
      else if (selected && !CAUSE[selected]) select(selected);
      else drawDetail();
    }
  } catch (_) {
    $("note").textContent = "The RCT log needs the running app: nothing answered at /dkrmm/rct-log.";
  }
}
let timer = null;
window.poSuspend = (off) => {
  if (off) { clearInterval(timer); timer = null; }
  else if (!timer) { poll(); timer = setInterval(poll, 3000); }
};
window.poSuspend(false);
</script>
</body>
</html>
