[pytest]
testpaths = tests
markers =
    slow: a long-running test (still run by default)
# Starlette's TestClient warns on import that it would rather run on `httpx2`;
# the `dev` extra installs `httpx`, which it still supports. Only that notice,
# about the test client's own transport, is silenced.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
