<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1240" width="1400" height="1240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="M-S-DROP with the model enabled, measured on five runs. Before tick 400: 4246 decisions, 697 eligible and all 697 consulted, 737 model calls all successful, 634 model answers accepted, 298 of them followed by a robot command that was applied. From tick 400: 9778 messages sent and none delivered, 9 decisions all by rule, no consultation and no model call, no robot command applied. Every run collapses in both modes.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b1452f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a53"/>
    </marker>
  </defs>
  <rect width="1400" height="1240" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="38" font-size="20" font-weight="700" fill="#222">M-S-DROP with the model enabled: after tick 400 the model is never asked</text>
  <text x="40" y="61" fill="#555">Version 2, measured. Model-enabled runs: seeds 11 to 15, 2800 ticks, qwen3:8b on local Ollama through CrewAI, every message dropped from tick 400 (results/collapse_scenarios/MS-DROP).</text>
  <text x="40" y="79" fill="#555">Rules-only: the same seeds and fault, --rules. Matched control: the same seeds, model mode, no fault (results/c2_near_system_override/N). Source: docs/ms-drop-model-enabled.md.</text>

  <!-- panel 1: stages -->
  <text x="40" y="114" font-size="16" font-weight="700" fill="#222">1  The decision pathway, stage by stage (model-enabled, five runs added together)</text>
  <g font-size="12" font-weight="700" fill="#222" text-anchor="middle">
    <text x="230" y="146">message delivered</text><text x="230" y="161">to the agent</text>
    <text x="405" y="146">decision reached</text><text x="405" y="161">(decide)</text>
    <text x="580" y="146">eligible for the model</text><text x="580" y="161">(rule recorded a trigger)</text>
    <text x="755" y="146">consulted: CrewAI,</text><text x="755" y="161">Ollama over local HTTP</text>
    <text x="930" y="146">model answer</text><text x="930" y="161">accepted by the gate</text>
    <text x="1105" y="146">effect sent after it</text><text x="1105" y="161">(messages, delivered)</text>
    <text x="1280" y="146">robot applied a command</text><text x="1280" y="161">(command_* event)</text>
  </g>

  <!-- row: before 400 -->
  <text x="40" y="208" font-weight="700" fill="#1f7a53">Ticks 0 to 399</text>
  <g font-size="12" text-anchor="middle">
    <rect x="150" y="180" width="160" height="62" rx="6" fill="#e3f1ea" stroke="#1f7a53"/>
    <text x="230" y="205" font-size="15" font-weight="700" fill="#1f7a53">13,338</text><text x="230" y="224" fill="#1f7a53">of 13,366 sent</text>
    <rect x="325" y="180" width="160" height="62" rx="6" fill="#e3f1ea" stroke="#1f7a53"/>
    <text x="405" y="205" font-size="15" font-weight="700" fill="#1f7a53">4,246</text><text x="405" y="224" fill="#1f7a53">decisions</text>
    <rect x="500" y="180" width="160" height="62" rx="6" fill="#e3f1ea" stroke="#1f7a53"/>
    <text x="580" y="205" font-size="15" font-weight="700" fill="#1f7a53">697</text><text x="580" y="224" fill="#1f7a53">eligible</text>
    <rect x="675" y="180" width="160" height="62" rx="6" fill="#ece6f8" stroke="#7a5cc4"/>
    <text x="755" y="205" font-size="15" font-weight="700" fill="#4a3a80">697 consulted</text><text x="755" y="224" fill="#4a3a80">737 calls, all HTTP 200</text>
    <rect x="850" y="180" width="160" height="62" rx="6" fill="#e3f1ea" stroke="#1f7a53"/>
    <text x="930" y="205" font-size="15" font-weight="700" fill="#1f7a53">634</text><text x="930" y="224" fill="#1f7a53">62 refused, rule used</text>
    <rect x="1025" y="180" width="160" height="62" rx="6" fill="#e3f1ea" stroke="#1f7a53"/>
    <text x="1105" y="205" font-size="15" font-weight="700" fill="#1f7a53">702 messages</text><text x="1105" y="224" fill="#1f7a53">699 delivered, 3 dropped</text>
    <rect x="1200" y="180" width="160" height="62" rx="6" fill="#e3f1ea" stroke="#1f7a53"/>
    <text x="1280" y="205" font-size="15" font-weight="700" fill="#1f7a53">298</text><text x="1280" y="224" fill="#1f7a53">model decisions with effect</text>
  </g>
  <g stroke="#1f7a53" stroke-width="1.6">
    <line x1="311" y1="211" x2="323" y2="211" marker-end="url(#arrow-green)"/>
    <line x1="486" y1="211" x2="498" y2="211" marker-end="url(#arrow-green)"/>
    <line x1="661" y1="211" x2="673" y2="211" marker-end="url(#arrow-green)"/>
    <line x1="836" y1="211" x2="848" y2="211" marker-end="url(#arrow-green)"/>
    <line x1="1011" y1="211" x2="1023" y2="211" marker-end="url(#arrow-green)"/>
    <line x1="1186" y1="211" x2="1198" y2="211" marker-end="url(#arrow-green)"/>
  </g>

  <!-- row: from 400 -->
  <text x="40" y="288" font-weight="700" fill="#b1452f">Tick 400 on</text>
  <text x="40" y="306" font-size="12" fill="#555">every message</text>
  <text x="40" y="320" font-size="12" fill="#555">dropped</text>
  <g font-size="12" text-anchor="middle">
    <rect x="150" y="260" width="160" height="62" rx="6" fill="#f7e0da" stroke="#b1452f" stroke-width="2"/>
    <text x="230" y="285" font-size="15" font-weight="700" fill="#b1452f">0</text><text x="230" y="304" fill="#7a2e1f">of 9,778 sent</text>
    <rect x="325" y="260" width="160" height="62" rx="6" fill="#f7e0da" stroke="#b1452f"/>
    <text x="405" y="285" font-size="15" font-weight="700" fill="#b1452f">9</text><text x="405" y="304" fill="#7a2e1f">all answered by rule</text>
    <rect x="500" y="260" width="160" height="62" rx="6" fill="#f7e0da" stroke="#b1452f"/>
    <text x="580" y="285" font-size="15" font-weight="700" fill="#b1452f">0</text><text x="580" y="304" fill="#7a2e1f">eligible</text>
    <rect x="675" y="260" width="160" height="62" rx="6" fill="#f7e0da" stroke="#b1452f"/>
    <text x="755" y="285" font-size="15" font-weight="700" fill="#b1452f">0 consulted</text><text x="755" y="304" fill="#7a2e1f">0 model calls</text>
    <rect x="850" y="260" width="160" height="62" rx="6" fill="#f7e0da" stroke="#b1452f"/>
    <text x="930" y="285" font-size="15" font-weight="700" fill="#b1452f">0</text><text x="930" y="304" fill="#7a2e1f">accepted</text>
    <rect x="1025" y="260" width="160" height="62" rx="6" fill="#f7e0da" stroke="#b1452f"/>
    <text x="1105" y="285" font-size="15" font-weight="700" fill="#b1452f">0</text><text x="1105" y="304" fill="#7a2e1f">sent after a decision</text>
    <rect x="1200" y="260" width="160" height="62" rx="6" fill="#f7e0da" stroke="#b1452f"/>
    <text x="1280" y="285" font-size="15" font-weight="700" fill="#b1452f">0</text><text x="1280" y="304" fill="#7a2e1f">commands applied</text>
  </g>
  <g stroke="#b1452f" stroke-width="3" stroke-linecap="round">
    <line x1="311" y1="285" x2="323" y2="297"/><line x1="323" y1="285" x2="311" y2="297"/>
  </g>

  <!-- notes under panel 1 -->
  <g font-size="12" fill="#333">
    <text x="150" y="350" font-weight="700" fill="#222">Why nothing happens after 400</text>
    <text x="150" y="368">Every decision the model can answer is made in a message handler</text>
    <text x="150" y="384">(_sub_result of SCHEDULING, ROUTING, INTAKE): it needs a sub-agent's</text>
    <text x="150" y="400">answer delivered first. The agents keep asking: of the 9,778 messages</text>
    <text x="150" y="416">sent after 400, 6,403 are robot reports and 2,615 sub-task requests.</text>
    <text x="150" y="432">None is delivered, so no such decision is ever reached.</text>

    <text x="620" y="350" font-weight="700" fill="#4a3a80">Where CrewAI sits</text>
    <text x="620" y="368">The owner and peer talk in-process, through a CrewAI tool, inside</text>
    <text x="620" y="384">the tick: 20 of 20 peer answers came in the same tick as the question.</text>
    <text x="620" y="400">The bus delivers no sooner than the next tick. The model is reached</text>
    <text x="620" y="416">over local HTTP. CONSULT_* messages on the bus are record copies.</text>
    <text x="620" y="432">No retries; the one unparsable answer fell back to the rule.</text>

    <text x="1060" y="350" font-weight="700" fill="#1f7a53">Without the drop (matched control)</text>
    <text x="1060" y="368">The same five seeds, model mode, no</text>
    <text x="1060" y="384">fault: 1,295 consultations and 1,517</text>
    <text x="1060" y="400">model calls after tick 400, and 3,058</text>
    <text x="1060" y="416">robot commands applied.</text>
  </g>

  <!-- panel 2: one decision, two fates -->
  <text x="40" y="478" font-size="16" font-weight="700" fill="#222">2  A computed decision is not an applied action (model-enabled seed 15, the last two ticks before the fault)</text>

  <rect x="40" y="494" width="1320" height="62" rx="6" fill="#f6fbf8" stroke="#1f7a53"/>
  <text x="56" y="516" font-weight="700" fill="#1f7a53">tick 398</text>
  <g font-size="12" fill="#222">
    <text x="130" y="516">ROUTING resolve_block, eligible</text>
    <line x1="318" y1="512" x2="340" y2="512" stroke="#333" marker-end="url(#arrow)"/>
    <text x="346" y="516">model: REROUTE (292 ms)</text>
    <line x1="502" y1="512" x2="524" y2="512" stroke="#333" marker-end="url(#arrow)"/>
    <text x="530" y="516">gate: ok</text>
    <line x1="586" y1="512" x2="608" y2="512" stroke="#333" marker-end="url(#arrow)"/>
    <text x="614" y="516">ROBOT_COMMAND set_route to R3, delivered</text>
    <line x1="878" y1="512" x2="900" y2="512" stroke="#333" marker-end="url(#arrow)"/>
    <text x="906" y="516" font-weight="700" fill="#1f7a53">R3 applied it at tick 399 (command_set_route): effect</text>
    <text x="130" y="542" fill="#555">The model's answer moved a robot because the message that carried it arrived.</text>
  </g>

  <rect x="40" y="566" width="1320" height="88" rx="6" fill="#fdf5f3" stroke="#b1452f"/>
  <text x="56" y="588" font-weight="700" fill="#b1452f">tick 399</text>
  <g font-size="12" fill="#222">
    <text x="130" y="588">SCHEDULING choose_robot for T-0121</text>
    <line x1="350" y1="584" x2="372" y2="584" stroke="#333" marker-end="url(#arrow)"/>
    <text x="378" y="588">model: R5 (361 ms)</text>
    <line x1="494" y1="584" x2="516" y2="584" stroke="#333" marker-end="url(#arrow)"/>
    <text x="522" y="588">gate: ok</text>
    <line x1="578" y1="584" x2="600" y2="584" stroke="#333" marker-end="url(#arrow)"/>
    <text x="606" y="588">registry: T-0121 assigned to R5</text>
    <line x1="790" y1="584" x2="812" y2="584" stroke="#333" marker-end="url(#arrow)"/>
    <text x="818" y="588">ROUTE_REQUEST and RESOURCE_REQUEST dropped at tick 400</text>
    <text x="130" y="614">tick 430: SCHEDULING releases T-0121, "no answer in 31 ticks at stage routing"; R5 never moves for it.</text>
    <text x="130" y="636" font-weight="700" fill="#b1452f">Effect: a 31-tick reservation in the registry, then undone. No robot moved, no parcel moved.</text>
  </g>

  <!-- panel 3: per seed -->
  <text x="40" y="694" font-size="16" font-weight="700" fill="#222">3  The five seeds: rules-only (R) and model-enabled (M)</text>
  <g font-size="12">
    <rect x="40" y="706" width="1320" height="44" fill="#f2f2f2" stroke="#ccc"/>
    <g font-weight="700" fill="#222">
      <text x="56" y="725">seed</text>
      <text x="120" y="725">model calls</text><text x="120" y="741" font-weight="400" fill="#555">M: before / after 400</text>
      <text x="290" y="725">control calls</text><text x="290" y="741" font-weight="400" fill="#555">after 400, no drop</text>
      <text x="430" y="725">collapse tick</text><text x="430" y="741" font-weight="400" fill="#555">R / M (criterion)</text>
      <text x="570" y="725">critical stop</text><text x="570" y="741" font-weight="400" fill="#555">R / M</text>
      <text x="690" y="725">parcels out</text><text x="690" y="741" font-weight="400" fill="#555">R / M</text>
      <text x="810" y="725">backlog at end</text><text x="810" y="741" font-weight="400" fill="#555">R / M</text>
      <text x="950" y="725">DK-RMM on M (older monitor)</text><text x="950" y="741" font-weight="400" fill="#555">STABLE / RCT windows after 400</text>
      <text x="1190" y="725">DK-RMM on R, extended</text><text x="1190" y="741" font-weight="400" fill="#555">first UNSTABLE / RCT</text>
    </g>
    <g fill="#222">
      <text x="56" y="772">11</text><text x="120" y="772">149 / 0</text><text x="290" y="772">328</text><text x="430" y="772">722 / 722</text><text x="570" y="772">983 / 983</text><text x="690" y="772">13 / 15</text><text x="810" y="772">31 / 36</text><text x="950" y="772">92 / 0 of 120</text><text x="1190" y="772">421 / 461</text>
      <text x="56" y="796">12</text><text x="120" y="796">168 / 0</text><text x="290" y="796">339</text><text x="430" y="796">708 / 791</text><text x="570" y="796">941 / 983</text><text x="690" y="796">14 / 14</text><text x="810" y="796">32 / 32</text><text x="950" y="796">78 / 0 of 120</text><text x="1190" y="796">601 / 461</text>
      <text x="56" y="820">13</text><text x="120" y="820">153 / 0</text><text x="290" y="820">255</text><text x="430" y="820">666 / 666</text><text x="570" y="820">941 / 1025</text><text x="690" y="820">13 / 15</text><text x="810" y="820">32 / 32</text><text x="950" y="820">65 / 0 of 120</text><text x="1190" y="820">461 / 2421</text>
      <text x="56" y="844">14</text><text x="120" y="844">147 / 0</text><text x="290" y="844">301</text><text x="430" y="844">666 / 708</text><text x="570" y="844">983 / 1025</text><text x="690" y="844">15 / 18</text><text x="810" y="844">32 / 34</text><text x="950" y="844">67 / 0 of 120</text><text x="1190" y="844">461 / none</text>
      <text x="56" y="868">15</text><text x="120" y="868">120 / 0</text><text x="290" y="868">294</text><text x="430" y="868">698 / 750</text><text x="570" y="868">983 / 983</text><text x="690" y="868">14 / 17</text><text x="810" y="868">33 / 30</text><text x="950" y="868">74 / 0 of 120</text><text x="1190" y="868">461 / 481</text>
    </g>
    <g stroke="#e3e3e3"><line x1="40" y1="780" x2="1360" y2="780"/><line x1="40" y1="804" x2="1360" y2="804"/><line x1="40" y1="828" x2="1360" y2="828"/><line x1="40" y1="852" x2="1360" y2="852"/><line x1="40" y1="876" x2="1360" y2="876"/></g>
    <text x="56" y="896" fill="#555">All ten runs COLLAPSED under the unchanged criterion. Every failed model call: 0. DK-RMM stayed an observer in every run. The extended monitor on the rules-only runs reaches a message failure rate of 1.0 at tick 461 in every seed.</text>
  </g>

  <!-- panel 4: what can and cannot be said -->
  <text x="40" y="936" font-size="16" font-weight="700" fill="#222">4  What these runs show, and what they do not</text>
  <rect x="40" y="950" width="427" height="232" rx="6" fill="#e3f1ea" stroke="#1f7a53"/>
  <text x="56" y="973" font-weight="700" fill="#1f7a53">Observed</text>
  <g font-size="12" fill="#222">
    <text x="56" y="994">Before 400, every eligible decision went to the</text>
    <text x="56" y="1010">model (697 of 697); 737 calls, none failed.</text>
    <text x="56" y="1030">From 400, no decision the model could answer is</text>
    <text x="56" y="1046">reached: 0 consultations, 0 calls, in 5 of 5 runs.</text>
    <text x="56" y="1066">A model decision acts on the floor only through a</text>
    <text x="56" y="1082">message; when the message is dropped it leaves at</text>
    <text x="56" y="1098">most a registry entry (seed 15, tick 399).</text>
    <text x="56" y="1118">Both modes collapse in every seed; the model-enabled</text>
    <text x="56" y="1134">runs collapse at the same tick or later (0 to +83)</text>
    <text x="56" y="1150">and send out the same number of parcels or 1 to 3 more.</text>
  </g>

  <rect x="487" y="950" width="427" height="232" rx="6" fill="#fff6e8" stroke="#b06a1e"/>
  <text x="503" y="973" font-weight="700" fill="#7a4a12">Not established</text>
  <g font-size="12" fill="#222">
    <text x="503" y="994">That the model caused the later collapse. The two</text>
    <text x="503" y="1010">modes enter tick 400 in different states, because</text>
    <text x="503" y="1026">the model answered differently from the rule.</text>
    <text x="503" y="1046">An exact counterfactual. The model's answers are not</text>
    <text x="503" y="1062">reproducible run to run (temperature 0, seed 42):</text>
    <text x="503" y="1078">model run and control first differ at tick 107, 21,</text>
    <text x="503" y="1094">59, 138 and 17, once (seed 15) in the choice itself.</text>
    <text x="503" y="1114">After 400 the two modes run the same Python code: the</text>
    <text x="503" y="1130">model is not consulted, so it cannot act during the</text>
    <text x="503" y="1146">fault.</text>
  </g>

  <rect x="933" y="950" width="427" height="232" rx="6" fill="#f2f2f2" stroke="#777"/>
  <text x="949" y="973" font-weight="700" fill="#222">Not available yet</text>
  <g font-size="12" fill="#222">
    <text x="949" y="994">The extended DK-RMM monitor on the model-enabled</text>
    <text x="949" y="1010">runs: they were made before the extension, and the</text>
    <text x="949" y="1026">monitor reads live state, so it needs a rerun</text>
    <text x="949" y="1042">(command in section 10 of the report).</text>
    <text x="949" y="1062">Backlog by zone over time: the saved files keep the</text>
    <text x="949" y="1078">total backlog per tick only.</text>
    <text x="949" y="1098">A model decision whose ROBOT_COMMAND is dropped:</text>
    <text x="949" y="1114">not observed. The one dropped model decision (tick</text>
    <text x="949" y="1130">399) lost a route and a resource request, not a</text>
    <text x="949" y="1146">robot command.</text>
  </g>

  <text x="40" y="1214" font-size="12" fill="#777">Counts from tools/analyze_ms_drop_model.py over the runs' event logs (results/m_s_drop_crewai/analysis). Version 1 of this schema (ms-drop-crewai.svg) is kept; it was drawn before these runs were analysed.</text>
</svg>
